name: Build Repository Architecture

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Structure from YAML Blueprint
        run: |
          echo "Building architecture from agent-anna.yaml..."
          
          # Create directories
          mkdir -p character knowledge plans/active plans/archive plans/logs .github/workflows
          
          # Initialize safe baseline files if they don't already exist
          [ -f character/agent-anna.md ] || echo "# AGENT ANNA // CORE" > character/agent-anna.md
          [ -f knowledge/agents.md ] || echo "# AGENTS" > knowledge/agents.md
          [ -f knowledge/lessons.md ] || echo "# LESSONS" > knowledge/lessons.md
          [ -f knowledge/rules.md ] || echo "# RULES" > knowledge/rules.md
          [ -f plans/active/current-plan.md ] || echo "# CURRENT PLAN" > plans/active/current-plan.md
          [ -f plans/active/roadmap.md ] || echo "# ROADMAP" > roadmap.md
          [ -f plans/logs/session-log.md ] || echo "# LOGS" > session-log.md
          [ -f portal-relay.json ] || echo '{"status":"SYNCHRONIZED"}' > portal-relay.json

          echo "Architecture scaffold complete."

      - name: Commit & Push Scaffolded Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated architecture build from agent-anna.yaml manifest"
          branch: main
