name: Team AA Full Deployment

on:
  workflow_dispatch:

jobs:
  deploy-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      - name: Create Character Files
        run: |
          # AA01
          printf '# AGENT ANNA (AA01)\n**ID:** AGENT-AA01\n**Role:** Executive Command\n**Safe Word:** Swallows\n' > agent-anna/character/agent-anna.md
          gh api repos/agent-anna/agent-anna/contents/agent-anna/character/agent-anna.md -X PUT -f message="AA01" -f content="$(cat agent-anna/character/agent-anna.md)"
          
          # AA02
          printf '# AGENT ANNA CLONE 02 (AA02)\n**Namesake:** Agent Anna\n**ID:** AGENT-AA02\n**Role:** Crypto Analysis\n**Safe Word:** Swallows\n' > agent-anna/character/agent-aa02.md
          gh api repos/agent-anna/agent-anna/contents/agent-anna/character/agent-aa02.md -X PUT -f message="AA02" -f content="$(cat agent-anna/character/agent-aa02.md)"
          
          # AA03
          printf '# AGENT ANNA CLONE 03 (AA03)\n**Namesake:** Agent Anna\n**ID:** AGENT-AA03\n**Role:** Portfolio Intelligence\n**Safe Word:** Swallows\n' > agent-anna/character/agent-aa03.md
          gh api repos/agent-anna/agent-anna/contents/agent-anna/character/agent-aa03.md -X PUT -f message="AA03" -f content="$(cat agent-anna/character/agent-aa03.md)"
          
          # AA04
          printf '# AGENT ANNA CLONE 04 (AA04)\n**Namesake:** Agent Anna\n**ID:** AGENT-AA04\n**Role:** Risk Management\n**Safe Word:** Swallows\n' > agent-anna/character/agent-aa04.md
          gh api repos/agent-anna/agent-anna/contents/agent-anna/character/agent-aa04.md -X PUT -f message="AA04" -f content="$(cat agent-anna/character/agent-aa04.md)"
          
