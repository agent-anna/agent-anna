name: Team AA Clone Deployment

on:
  workflow_dispatch:

jobs:
  deploy-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Team AA via GitHub API
        env:
          TOKEN: ${{ secrets.PAT }}
          REPO: agent-anna/agent-anna
          BRANCH: main
        run: |
          # AA02 Character File
          curl -s -X PUT \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$REPO/contents/agent-anna/character/agent-astra.md \
            -d '{"message":"Team AA - Add AA02","content":"","branch":"'$BRANCH'"}'
          
          # AA03 Character File
          curl -s -X PUT \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$REPO/contents/agent-anna/character/agent-aria.md \
            -d '{"message":"Team AA - Add AA03","content":"","branch":"'$BRANCH'"}'
          
          echo "TEAM AA DEPLOYED"
