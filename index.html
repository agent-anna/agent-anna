<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Kunda Cafe - Agent Anna Home</title>    <style>        * {            margin: 0;            padding: 0;            box-sizing: border-box;        }        body {            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);            min-height: 100vh;            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;            color: #fff;        }        .container {            text-align: center;            padding: 40px;        }        h1 {            font-size: 2.5rem;            margin-bottom: 20px;            background: linear-gradient(90deg, #00d4ff, #00ff88);            -webkit-background-clip: text;            -webkit-text-fill-color: transparent;        }        .subtitle {            font-size: 1.2rem;            color: #888;            margin-bottom: 40px;        }        .nav-card {            background: rgba(255, 255, 255, 0.05);            border: 1px solid rgba(0, 212, 255, 0.3);            border-radius: 12px;            padding: 30px 50px;            transition: all 0.3s ease;            cursor: pointer;        }        .nav-card:hover {            background: rgba(0, 212, 255, 0.1);            border-color: #00d4ff;            transform: translateY(-5px);            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);        }        .nav-card h2 {            color: #00d4ff;            margin-bottom: 10px;        }        .nav-card p {            color: #aaa;        }        a {            text-decoration: none;            color: inherit;        }        .status {            margin-top: 40px;            padding: 15px 30px;            background: rgba(0, 255, 136, 0.1);            border: 1px solid #00ff88;            border-radius: 8px;            color: #00ff88;        }    </style></head><body>    <div class="container">        <h1>Kunda Cafe</h1>        <p class="subtitle">Agent Anna Operating Base</p>        <a href="agent-anna/index.html">            <div class="nav-card">                <h2>🚀 Enter Agent Anna HQ</h2>                <p>agent-anna/index.html</p>            </div>        </a>                <div class="status">            ✓ System Online - Ready for Testing        </div>    </div></body></html>
